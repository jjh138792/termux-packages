name: 🚀 Build Termux QEMU (Rutabaga 满血零拷贝版)

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Architect Rutabaga Package and Patch QEMU
        run: |
          mkdir -p packages/rutabaga-gfx-ffi
          cat << 'EOF' > packages/rutabaga-gfx-ffi/build.sh
          TERMUX_PKG_HOMEPAGE=https://github.com/magma-gpu/rutabaga_gfx
          TERMUX_PKG_DESCRIPTION="Rutabaga GFX FFI"
          TERMUX_PKG_LICENSE="BSD"
          TERMUX_PKG_VERSION=0.1.3
          TERMUX_PKG_SKIP_SRC_EXTRACT=true

          termux_step_make() {
              # 颁发版权免死金牌
              mkdir -p $TERMUX_PKG_SRCDIR
              echo "BSD License" > $TERMUX_PKG_SRCDIR/LICENSE

              termux_setup_rust
              rustup target add aarch64-linux-android
              
              echo "[*] Cloning standalone Rutabaga_gfx repository..."
              git clone https://github.com/magma-gpu/rutabaga_gfx.git
              
              # 斩断幽灵工具链
              rm -f rutabaga_gfx/rust-toolchain rutabaga_gfx/rust-toolchain.toml
              
              cd rutabaga_gfx/ffi
              echo "[*] Compiling Rutabaga FFI for aarch64..."
              cargo build --release --target aarch64-linux-android
          }

          termux_step_make_install() {
              cd rutabaga_gfx/ffi
              
              install -Dm755 ../target/aarch64-linux-android/release/librutabaga_gfx_ffi.so $TERMUX_PREFIX/lib/librutabaga_gfx_ffi.so
              
              # ！！！满足 QEMU 源码对 rutabaga_gfx/ 子目录的硬编码癖好！！！
              install -Dm644 src/include/rutabaga_gfx_ffi.h $TERMUX_PREFIX/include/rutabaga_gfx/rutabaga_gfx_ffi.h
              
              mkdir -p $TERMUX_PREFIX/lib/pkgconfig
              cat << PC_EOF > $TERMUX_PREFIX/lib/pkgconfig/rutabaga_gfx_ffi.pc
          Name: rutabaga_gfx_ffi
          Description: Rutabaga GFX FFI
          Version: 0.1.3
          Libs: -L${TERMUX_PREFIX}/lib -lrutabaga_gfx_ffi
          Cflags: -I${TERMUX_PREFIX}/include
          PC_EOF
          }
          EOF

          QEMU_BUILD_SCRIPT="x11-packages/qemu-system-x86-64/build.sh"
          if [ ! -f "$QEMU_BUILD_SCRIPT" ]; then
              QEMU_BUILD_SCRIPT="packages/qemu-system-x86-64/build.sh"
          fi

          # ！！！工业级正则匹配注入，已实战证明能完美绕过 buildorder.py 的弱智崩溃 ！！！
          sed -i -E 's/(TERMUX_PKG_DEPENDS=")/\1rutabaga-gfx-ffi, /' $QEMU_BUILD_SCRIPT
          sed -i -E 's/(TERMUX_PKG_BUILD_DEPENDS=")/\1rutabaga-gfx-ffi, /' $QEMU_BUILD_SCRIPT
          sed -i -E 's/(TERMUX_PKG_EXTRA_CONFIGURE_ARGS=")/\1--enable-rutabaga /' $QEMU_BUILD_SCRIPT

      - name: Execute Sequential Cross-Compilation
        run: |
          echo "[*] 激活 Docker 编译舱：按序执行 Rutabaga 与 QEMU 拓扑构建..."
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I rutabaga-gfx-ffi qemu-system-x86-64

      - name: Upload QEMU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rutabaga-aarch64-debs
          path: output/*.deb
          retention-days: 7
          
