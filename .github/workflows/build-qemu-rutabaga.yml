name: 🚀 Build Termux QEMU (Rutabaga 满血零拷贝版)

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Architect Rutabaga Package and Patch QEMU
        run: |
          mkdir -p packages/rutabaga-gfx-ffi
          cat << 'EOF' > packages/rutabaga-gfx-ffi/build.sh
          TERMUX_PKG_HOMEPAGE=https://github.com/magma-gpu/rutabaga_gfx
          TERMUX_PKG_DESCRIPTION="Rutabaga GFX FFI (Latest Git)"
          TERMUX_PKG_LICENSE="BSD"
          TERMUX_PKG_VERSION=0.1.76
          TERMUX_PKG_SKIP_SRC_EXTRACT=true
          # 必须先安装 virglrenderer 才能编译带此 feature 的 rutabaga
          TERMUX_PKG_DEPENDS="virglrenderer"
          TERMUX_PKG_BUILD_DEPENDS="virglrenderer"

          termux_step_make() {
              # 颁发版权免死金牌
              mkdir -p $TERMUX_PKG_SRCDIR
              echo "BSD License" > $TERMUX_PKG_SRCDIR/LICENSE

              termux_setup_rust
              rustup target add aarch64-linux-android
              
              echo "[*] 从 Github 官方源拉取最新版 Rutabaga GFX (带完整子模块)..."
              git clone --recurse-submodules https://github.com/magma-gpu/rutabaga_gfx.git $TERMUX_PKG_SRCDIR/repo
              
              cd $TERMUX_PKG_SRCDIR/repo/ffi
              
              echo "[*] Compiling Rutabaga FFI for aarch64 with virgl_renderer..."
              # 抛弃 gfxstream 的 C++ 泥潭，使用官方支持的 virgl_renderer 满血后端
              cargo build --release --target aarch64-linux-android --features=virgl_renderer
          }

          termux_step_make_install() {
              cd $TERMUX_PKG_SRCDIR/repo/ffi
              
              install -Dm755 target/aarch64-linux-android/release/librutabaga_gfx_ffi.so $TERMUX_PREFIX/lib/librutabaga_gfx_ffi.so
              
              # 满足 QEMU 源码对 rutabaga_gfx/ 子目录的硬编码
              install -Dm644 src/include/rutabaga_gfx_ffi.h $TERMUX_PREFIX/include/rutabaga_gfx/rutabaga_gfx_ffi.h
              
              mkdir -p $TERMUX_PREFIX/lib/pkgconfig
              cat << PC_EOF > $TERMUX_PREFIX/lib/pkgconfig/rutabaga_gfx_ffi.pc
          Name: rutabaga_gfx_ffi
          Description: Rutabaga GFX FFI
          Version: 0.1.76
          Libs: -L${TERMUX_PREFIX}/lib -lrutabaga_gfx_ffi
          Cflags: -I${TERMUX_PREFIX}/include
          PC_EOF
          }
          EOF
          
          QEMU_BUILD_SCRIPT="x11-packages/qemu-system-x86-64/build.sh"
          if [ ! -f "$QEMU_BUILD_SCRIPT" ]; then
              QEMU_BUILD_SCRIPT="packages/qemu-system-x86-64/build.sh"
          fi

          # 注入依赖图谱：加入 rutabaga 和 virglrenderer
          sed -i -E 's/^(TERMUX_PKG_DEPENDS=")/\1rutabaga-gfx-ffi, virglrenderer, /' $QEMU_BUILD_SCRIPT
          sed -i -E 's/^(TERMUX_PKG_BUILD_DEPENDS=")/\1rutabaga-gfx-ffi, virglrenderer, /' $QEMU_BUILD_SCRIPT
          
          # ！！！【终极黑客防暴毙补丁：阻止 Strip 并强开 Debug】！！！
          echo 'TERMUX_DEBUG_BUILD=true' >> $QEMU_BUILD_SCRIPT
          
          # 清洗 disable 拦截，精准注入原生参数
          sed -i 's/--disable-rutabaga-gfx//g' $QEMU_BUILD_SCRIPT
          sed -i 's/--disable-rutabaga//g' $QEMU_BUILD_SCRIPT
          echo 'TERMUX_PKG_EXTRA_CONFIGURE_ARGS+=" --enable-rutabaga-gfx --enable-debug "' >> $QEMU_BUILD_SCRIPT
          
      - name: Execute Sequential Cross-Compilation
        run: |
          echo "[*] 启动 Docker 交叉编译环境..."
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I rutabaga-gfx-ffi qemu-system-x86-64

      # ！！！【胜利的扫尾：把冒号改成下划线，满足 GitHub 的洁癖】！！！
      - name: Sanitize Artifact Filenames
        run: |
          cd output
          for f in *.deb; do
            if [[ "$f" == *":"* ]]; then
              mv "$f" "${f//:/_}"
              echo "[*] 重命名文件: $f -> ${f//:/_}"
            fi
          done

      - name: Upload QEMU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rutabaga-aarch64-debs
          path: output/*.deb
          retention-days: 7
          
