name: 🚀 Build Termux QEMU (Rutabaga 三位一体满血上帝版)

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Execute Sequential Cross-Compilation
        run: |
          echo "[*] 启动 Docker 交叉编译环境..."
          # 严格按依赖顺序，一条指令直接打穿三大模块！
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I gfxstream rutabaga-gfx-ffi qemu-system-x86-64

      - name: Sanitize Artifact Filenames
        run: |
          cd output
          for f in *.deb; do
            if [[ "$f" == *":"* ]]; then
              mv "$f" "${f//:/_}"
              echo "[*] 重命名文件: $f -> ${f//:/_}"
            fi
          done

      - name: Upload QEMU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rutabaga-trinity-aarch64-debs
          path: output/*.deb
          retention-days: 7
          
