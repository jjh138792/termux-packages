name: 🚀 Build Termux QEMU (Rutabaga 三位一体满血上帝版)

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Dynamic Exorcism of Doxygen
        run: |
          echo "[*] 启动全盘雷达，猎杀导致崩溃的 libxml2 HTML文档生成器..."
          
          # 使用 find 命令进行维度打击，不管 libxml2 藏在哪里，直接锁定！
          LIBXML2_SCRIPT=$(find . -name "build.sh" | grep "/libxml2/build.sh" | head -n 1)
          
          if [ -n "$LIBXML2_SCRIPT" ]; then
              echo "[*] 成功锁定目标: $LIBXML2_SCRIPT"
              # 直接在文件末尾物理追加强行关闭文档的 Meson 标志
              echo 'TERMUX_PKG_EXTRA_CONFIGURE_ARGS+=" -Ddocs=disabled "' >> "$LIBXML2_SCRIPT"
              echo "[*] libxml2 的文档生成已被彻底物理阉割！"
          else
              echo "[!] 警告：未找到 libxml2 构建脚本，可能它不在此仓库层级中。"
          fi

                   # ！！！【新增：强制清除 util-linux 的旧世代 Autotools 契约】！！！
          UTIL_LINUX_SCRIPT=$(find . -name "build.sh" | grep "/util-linux/build.sh" | head -n 1)
          if [ -n "$UTIL_LINUX_SCRIPT" ]; then
              echo "[*] 锁定 util-linux: $UTIL_LINUX_SCRIPT"
              # 在第二行（紧跟 header 后）强行注入尚方宝剑变量
              sed -i '2i TERMUX_PKG_RM_ALREADY_AUTORECONFED=true' "$UTIL_LINUX_SCRIPT"
              echo "[*] util-linux 时间戳诅咒已被解除，强制使用现代容器重构！"
          fi
      - name: Pre-Docker Matrix Hacking (Host Side Injection)
        run: |
          echo "[*] 降维打击：在宿主机 (Host) 层面直接修改源码，彻底绕过 Docker 权限隔离墙！"
          
          # 1. 解决 util-linux 的 Autotools 时间戳/版本诅咒
          UTIL_LINUX_SCRIPT="packages/util-linux/build.sh"
          if [ -f "$UTIL_LINUX_SCRIPT" ]; then
              # 安全包裹原有的 post_patch 钩子
              cat << "EOF" >> "$UTIL_LINUX_SCRIPT"

          declare -f termux_step_post_patch >/dev/null && eval "$(echo "orig_termux_step_post_patch()"; declare -f termux_step_post_patch | tail -n +2)"
          termux_step_post_patch() {
              if declare -f orig_termux_step_post_patch >/dev/null; then orig_termux_step_post_patch; fi
              echo "[*] 正在执行真实的 autoreconf，彻底消除 automake-1.16 的版本诅咒..."
              cd $TERMUX_PKG_SRCDIR
              NOCONFIGURE=1 ./autogen.sh || autoreconf -fiv
              find . -type f -name "Makefile.in" -exec touch {} +
              touch configure
          }
          EOF
              echo "[*] util-linux 真实重构 Hook 注入成功！"
          fi

          # 2. ！！！【新增：解决 bash 的 C23 bool 关键字冲突】！！！
          BASH_SCRIPT="packages/bash/build.sh"
          if [ -f "$BASH_SCRIPT" ]; then
              # 安全包裹 pre_configure 钩子，绝不破坏 bash 原有的配置逻辑
              cat << "EOF" >> "$BASH_SCRIPT"

          declare -f termux_step_pre_configure >/dev/null && eval "$(echo "orig_bash_pre_configure()"; declare -f termux_step_pre_configure | tail -n +2)"
          termux_step_pre_configure() {
              echo "[*] 强制编译器退回 C17 时代，规避 C23 bool 关键字冲突！"
              # 给宿主机工具链 (mkbuiltins) 和目标机工具链同时降级
              export CFLAGS="$CFLAGS -std=gnu17"
              export CFLAGS_FOR_BUILD="$CFLAGS_FOR_BUILD -std=gnu17"
              export CC_FOR_BUILD="gcc -std=gnu17"
              
              if declare -f orig_bash_pre_configure >/dev/null; then orig_bash_pre_configure; fi
          }
          EOF
              echo "[*] bash C17 降级 Hook 注入成功！"
          fi
          
      - name: Execute Sequential Cross-Compilation
        run: |
          echo "[*] 启动 Docker 交叉编译环境..."
          ./scripts/run-docker.sh bash -c '
          
          echo "[*] 启动神级并发猎杀程序守护进程..."
          # 保留你无敌的并发猎杀程序 (在容器内绝对有效，因为这是 builder 自己的目录)
          ( while true; do
              DOX="/home/builder/.termux-build/libxml2/host-build/ubuntu_packages/usr/bin/doxygen"
              if [ -f "$DOX" ] && ! grep -q "exit 0" "$DOX"; then
                  echo "#!/bin/sh" > "$DOX" && echo "exit 0" >> "$DOX" && chmod +x "$DOX"
              fi
              sleep 0.2
          done ) &
          
          # 前台继续执行真正的串行编译
          ./build-package.sh -a aarch64 -I gfxstream && \
          ./build-package.sh -a aarch64 -I rutabaga-gfx-ffi && \
          ./build-package.sh -a aarch64 -I qemu-system-x86-64
          '
          
      - name: Sanitize Artifact Filenames
        run: |
          cd output
          for f in *.deb; do
            if [[ "$f" == *":"* ]]; then
              mv "$f" "${f//:/_}"
              echo "[*] 重命名文件: $f -> ${f//:/_}"
            fi
          done

      - name: Upload QEMU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rutabaga-trinity-aarch64-debs
          path: output/*.deb
          retention-days: 7
          
